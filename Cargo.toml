[package]
name = "reqfile"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
description = "Check that a codebase meets its requirements"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arkadia-so/reqfile"
homepage = "https://reqfile.dev"
keywords = ["requirements", "lint", "ci", "agents"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/", ".github/", "site/", "dist-workspace.toml", "EXPORT.toml"]

[workspace]
members = [".", "tests/support"]

[dependencies]
ast-grep-config = "0.45.3"
ast-grep-core = "0.45.3"
ast-grep-language = "0.45.3"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
libc = "0.2.189"
quick-xml = "0.38"
saphyr = "0.1.0"
saphyr-parser = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
reqfile-test-support = { path = "tests/support" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
