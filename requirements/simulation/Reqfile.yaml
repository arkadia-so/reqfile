# SIMULATION, a reqfile requirement package (https://reqfile.dev)
# ALPHA: written with an agent and not yet reviewed or measured by hand.
# Its checks and examples may be wrong; do not adopt it yet. See README.md.
reqfile: 1

code:
  - id: SIMULATION
    ref: FoundationDB; TigerBeetle
    must: Every step function has a deterministic simulation test, named with a `simulation` prefix, that runs seeded random event sequences and checks invariants after every step.
    why: It explores event orderings nobody writes by hand, and every failure is reproducible from its seed.
    who: Anyone changing state logic.
    checks:
      - adapter:
          use: ./.reqfile/SIMULATION
          check: seeded-transitions
