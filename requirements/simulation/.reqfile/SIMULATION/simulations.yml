# Simulation tests: test declarations named with a `simulation` prefix whose
# file calls a step function and checks an invariant inside a loop over events,
# in the test or in a helper it drives, with no unseeded randomness. Comments,
# docs, empty and unrelated tests never match.
id: simulation-rust
language: rust
severity: info
rule:
  kind: function_item
  all:
    - has: { field: name, regex: '^simulation' }
    - follows: { kind: attribute_item, regex: '^#\[(\w+::)*test\b' }
    # in the test itself or a helper of its file
    - inside:
        stopBy: end
        kind: source_file
        all:
        - has: { stopBy: end, kind: call_expression, has: { field: function, regex: '(^|::|\.)step$' } }
        - has:
            stopBy: end
            any: [{ kind: for_expression }, { kind: while_expression }, { kind: loop_expression }]
            has:
              stopBy: end
              any:
                - { kind: macro_invocation, regex: '^(debug_)?assert(_eq|_ne)?!' }
                - { kind: call_expression, has: { field: function, regex: '(?i)(invariant|check)\w*$' } }
        - not: { has: { stopBy: end, regex: '^(thread_rng|rand::random|rand::rng|rand::thread_rng)$' } }
---
id: simulation-python
language: python
severity: info
rule:
  kind: function_definition
  all:
    - has: { field: name, regex: '^(test_)?simulation' }
    # in the test itself or a helper of its file
    - inside:
        stopBy: end
        kind: module
        all:
        - has: { stopBy: end, kind: call, has: { field: function, regex: '(^|\.)step$' } }
        - has:
            stopBy: end
            any: [{ kind: for_statement }, { kind: while_statement }]
            has:
              stopBy: end
              any:
                - kind: assert_statement
                - { kind: call, has: { field: function, regex: '(?i)(^|\.)(assert\w*|\w*invariant\w*|check\w*)$' } }
        # module-level random functions are unseeded unless random.seed is given a seed
        - not:
            all:
              - has:
                  stopBy: end
                  kind: call
                  has: { field: function, regex: '^random\.(random|randint|randrange|choice|choices|shuffle|sample|uniform|getrandbits)$' }
              - not: { has: { stopBy: end, kind: call, regex: '^random\.seed\(\s*[^)\s]' } }
---
id: simulation-typescript
language: typescript
severity: info
rule:
  kind: call_expression
  all:
    - has: { field: function, regex: '^(it|test)(\.(only|concurrent))?$' }
    - has: { field: arguments, has: { kind: string, regex: '^.simulation' } }
    # in the test itself or a helper of its file
    - inside:
        stopBy: end
        kind: program
        all:
        - has: { stopBy: end, kind: call_expression, has: { field: function, regex: '(^|\.)step$' } }
        - has:
            stopBy: end
            any:
              - kind: for_statement
              - kind: for_in_statement
              - kind: while_statement
              - kind: do_statement
              - { kind: call_expression, has: { field: function, regex: '\.forEach$' } }
            has:
              stopBy: end
              kind: call_expression
              has: { field: function, regex: '(?i)^(expect|assert(\.\w+)?|\w*invariant\w*|check\w*)$' }
        - not: { has: { stopBy: end, kind: call_expression, has: { field: function, regex: '^Math\.random$' } } }
