# FAIL_FAST, a reqfile requirement package (https://reqfile.dev)
# ALPHA: written with an agent and not yet reviewed or measured by hand.
# Its checks and examples may be wrong; do not adopt it yet. See README.md.
reqfile: 1

code:
  - id: FAIL_FAST
    ref: Shore, "Fail Fast"; Erlang, "let it crash"
    must: No silent fallbacks, no swallowed errors, no default values that hide a failure.
    why: A swallowed error is an invariant violation nobody sees.
    who: Anyone debugging production; agents relying on invariants.
    checks:
      - command:
          run: ruff check --isolated --select E722,BLE001,S110 --output-format sarif
          fast: true
          files: "**/*.py"
          pass_files: true
          format: sarif
          fix_hint: Catch the specific expected error and handle it visibly, or let it propagate.
      - decision
