# Reusable checks; the requirement and its examples remain in Reqfile.yaml.
adapter: 1
kind: language
checks:
  python-errors:
    - command:
        run: ruff check --isolated --select E722,BLE001,S110 --output-format sarif
        fast: true
        files: "**/*.py"
        pass_files: true
        format: sarif
        fix_hint: Catch the specific expected error and handle it visibly, or let it propagate.
  visible-failures:
    - decision
