# Decoded external data used or asserted as a type without being parsed by a
# schema: fields read straight from JSON.parse, json.loads or response.json(),
# type assertions and casts of them, and double assertions through unknown.
# Tests only inspect data, they are not where it enters, so they are ignored.
id: unparsed-typescript
language: typescript
severity: error
ignores: ["**/tests/**", "**/__tests__/**", "**/*.test.*", "**/*.spec.*", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
message: Decoded data is used as a type without being parsed; parse it with a schema (Zod) first.
rule:
  any:
    - pattern: $X as unknown as $T
    - kind: call_expression
      regex: '^JSON\.parse\(|\.json\(\s*\)$'
      # data handed on to a schema, such as User.parse(JSON.parse(s).user), is parsed
      not: { inside: { stopBy: end, kind: arguments, inside: { kind: call_expression, has: { field: function, regex: '\.(parse|safeParse|parseAsync|safeParseAsync)$' } } } }
      any:
        - inside: { kind: member_expression, field: object }
        - inside: { kind: subscript_expression, field: object }
        - inside: { kind: as_expression, not: { regex: 'as\s+(unknown|const)$' } }
        - inside:
            kind: await_expression
            any:
              - inside: { kind: member_expression, field: object }
              - inside: { kind: subscript_expression, field: object }
              - inside: { kind: as_expression, not: { regex: 'as\s+(unknown|const)$' } }
        - inside:
            kind: await_expression
            inside:
              kind: parenthesized_expression
              any:
                - inside: { kind: member_expression, field: object }
                - inside: { kind: subscript_expression, field: object }
---
