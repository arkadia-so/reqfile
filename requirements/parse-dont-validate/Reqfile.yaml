# PARSE_DONT_VALIDATE, a reqfile requirement package (https://reqfile.dev)
# ALPHA: written with an agent and not yet reviewed or measured by hand.
# Its checks and examples may be wrong; do not adopt it yet. See README.md.
reqfile: 1

code:
  - id: PARSE_DONT_VALIDATE
    ref: King; Minsky, "make illegal states unrepresentable"
    must: External data is parsed once where it enters, with a schema library (Zod, Pydantic, serde), into precise types passed inward; no untyped values (`any`, `Any`) cross that boundary.
    why: Scattered checks hide which data is trusted, drift apart over time, and let invalid states reach the core.
    who: Anyone handling external input; the type checker.
    checks:
      - adapter:
          use: ./.reqfile/PARSE_DONT_VALIDATE
          check: python-types
      - adapter:
          use: ./.reqfile/PARSE_DONT_VALIDATE
          check: typescript-types
      - adapter:
          use: ./.reqfile/PARSE_DONT_VALIDATE
          check: parsed-input
