# FAST_FEEDBACK, a reqfile requirement package (https://reqfile.dev)
# Scenarios and baselines live in the repository's .github/fast-feedback.json; see README.md.
reqfile: 1

process:
  - id: FAST_FEEDBACK
    must: The feedback loop's latency never goes up; it only ratchets down.
    why: Every second of waiting for a check is paid on every change, by every person and agent, and a loop that slows down a little at a time is never noticed until it is slow.
    who: Anyone changing CI, the checks or the build; agents waiting for a check.
    checks:
      - adapter:
          use: ./.reqfile/FAST_FEEDBACK
          check: latency
      - adapter:
          use: ./.reqfile/FAST_FEEDBACK
          check: ratchet
