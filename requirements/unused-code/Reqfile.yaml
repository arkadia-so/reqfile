# UNUSED_CODE, a reqfile requirement package (https://reqfile.dev)
# ALPHA: written with an agent and not yet reviewed or measured by hand.
# Its checks and examples may be wrong; do not adopt it yet. See README.md.
reqfile: 1

code:
  - id: UNUSED_CODE
    ref: Beck, Extreme Programming (YAGNI)
    must: No unused code; unused functions, types, imports, variables, exports and dependencies are deleted.
    why: Every unused path is code someone has to read and maintain. Speculative abstractions and features are the wider YAGNI concern, left to review because no tool detects them.
    who: Maintainers; reviewers.
    checks:
      - adapter:
          use: ./.reqfile/UNUSED_CODE
          check: python-locals
      - adapter:
          use: ./.reqfile/UNUSED_CODE
          check: python-definitions
      - adapter:
          use: ./.reqfile/UNUSED_CODE
          check: rust
      - adapter:
          use: ./.reqfile/UNUSED_CODE
          check: typescript
