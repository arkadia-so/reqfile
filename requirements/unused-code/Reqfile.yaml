# UNUSED_CODE, a reqfile requirement package (https://reqfile.dev)
# ALPHA: written with an agent and not yet reviewed or measured by hand.
# Its checks and examples may be wrong; do not adopt it yet. See README.md.
reqfile: 1

code:
  - id: UNUSED_CODE
    ref: Beck, Extreme Programming (YAGNI)
    must: No unused code; unused functions, types, imports, variables, exports and dependencies are deleted.
    why: Every unused path is code someone has to read and maintain. Speculative abstractions and features are the wider YAGNI concern, left to review because no tool detects them.
    who: Maintainers; reviewers.
    checks:
      - command:
          run: ruff check --isolated --select F401,F841 --output-format sarif
          fast: true
          files: "**/*.py"
          pass_files: true
          format: sarif
          fix_hint: Delete the unused code.
      - command:
          run: $REQFILE_ASSETS/python.sh   # top-level functions and classes used nowhere, as SARIF
          fast: true
          files: "**/*.py"
          pass_files: true
          format: sarif
          fix_hint: Delete the unused function or class.
      - command:
          run: $REQFILE_ASSETS/rust.sh   # unused code in each crate containing the files, as SARIF
          files: "**/*.rs"
          pass_files: true
          format: sarif
          timeout: 600
          fix_hint: Delete the unused code.
      - command:
          run: $REQFILE_ASSETS/ts.sh     # knip in each package containing the files
          files: "**/*.{ts,tsx}"
          pass_files: true
          timeout: 300
          fix_hint: Delete the unused export, file or dependency.
